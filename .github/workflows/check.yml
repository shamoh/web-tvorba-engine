# "Kontrola kódu" of the engine: on a pull request and a push to main, the unit tests, the data of the test site
# (npm run check:site -- demo), a build of the test site from demo/ and demo-content/ (npm run demo:build: the pipeline
# on the test data and the site from it) and its images, sitemap, page texts and inline scripts (check:images), and the
# workflows themselves (actionlint, shellcheck of the helper scripts). The sites check themselves with their own data
# (site-check.yml, called by each of them).
# A failure on a push to main opens an issue in this repository assigned to its owner (.github/failure-issue.sh), so he
# gets an e-mail; the next passing run closes it. This repository is public: the issue only links the run and the commit.
name: Kontrola kódu

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the running check.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Data of the test site
        run: npm run check:site -- demo

      # the pipeline on the test data and the site built from them (.demo/site/dist)
      - name: Build the test site
        run: npm run demo:build

      - name: Images and sitemap of the built test site
        env:
          SITE_DIR: .demo/site
        run: npm run check:images

  # Syntax, expressions, action inputs and shell scripts (shellcheck) of every workflow in this repo.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: shellcheck of the helper scripts
        run: shellcheck .github/*.sh

  # The issue of a failed check on main (see the top); pull requests and manual runs are watched by whoever started
  # them. A run cancelled by a newer push does nothing.
  notify:
    needs: [check, workflows]
    if: always() && !cancelled() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github

      - name: Open or update the issue (sends an e-mail), or close it when the check passed
        run: |
          .github/failure-issue.sh "Kontrola kódu na main selhala" "$FAILED" "Běh: $RUN_URL
          Commit: ${GITHUB_SHA::7}

          Testy, build testovacího webu nebo kontrola workflow na main selhaly. Podrobnosti jsou v běhu."
