# Co návštěvníci smějí s obrazy, fotkami a texty webu.

# NEPOVINNÉ. Závěrečný odstavec pod textem, menším tlumeným písmem (např. pozvání, ať mi lidé napíšou).
# Piš ho pod „closing: |“, každý řádek odsazený dvěma mezerami:
#   - řádky zalamuj, kde chceš: na webu se spojí mezerou (příliš dlouhé zalomí automatika),
#   - prázdný řádek = nový odstavec,
#   - prázdné "" = bez závěrečného odstavce.
# Formátování:
#   - **slovo** = tučně,
#   - *slovo* = kurzívou,
#   - [text](/tvorba/) = odkaz na stránku tohoto webu (adresa začíná /),
#   - [text](k3f9a) = odkaz na jiný obraz podle jeho kódu id, [](k3f9a) = s jeho názvem jako textem odkazu
#     (rozpracovaný obraz zůstane bez odkazu),
#   - [text](https://…) = odkaz na jiný web, [text](mailto:…) = odkaz na e-mail.
closing: |
  Chcete obraz použít jinak? [Napište mi](/kontakt/) a domluvíme se.

# NEPOVINNÉ. Popis pro vyhledávače a náhled odkazu (Google, Facebook, WhatsApp): jedna nebo dvě věty, nejvýš
# 160 znaků, bez formátování; na stránce se neukáže. Prázdné = začátek textu.
description: |
  Obrazy, fotky a texty na tomto webu jsou moje autorská díla. Co s nimi smíte a kdy mě požádat o svolení.

# Text stránky pod nadpisem.
# Piš ho pod „text: |“, každý řádek odsazený dvěma mezerami:
#   - řádky zalamuj, kde chceš: na webu se spojí mezerou (příliš dlouhé zalomí automatika),
#   - prázdný řádek = nový odstavec,
#   - prázdné "" = bez textu.
# Formátování:
#   - **slovo** = tučně,
#   - *slovo* = kurzívou,
#   - [text](/tvorba/) = odkaz na stránku tohoto webu (adresa začíná /),
#   - [text](k3f9a) = odkaz na jiný obraz podle jeho kódu id, [](k3f9a) = s jeho názvem jako textem odkazu
#     (rozpracovaný obraz zůstane bez odkazu),
#   - [text](https://…) = odkaz na jiný web, [text](mailto:…) = odkaz na e-mail.
# Fotka ze složky fotky/ mezi odstavci:
#   - samostatný odstavec [fotka: portret, vlevo] = fotka fotky/portret.jpg vlevo (vpravo = vpravo, bez strany = vlevo),
#   - text nad ní je přes celou šířku, text pod ní ji obtéká z druhé strany (na mobilu je fotka mezi odstavci).
text: |
  Všechny obrazy, kresby, fotky a texty na tomto webu jsou moje autorská díla a chrání je autorský
  zákon. Všechna práva vyhrazena.

  **Sdílení je vítané:** odkaz na stránku obrazu můžete poslat komukoli a sdílet ho na sociálních
  sítích nebo na Pinterestu. Sdílí se odkaz s náhledem, obraz zůstává tady.

  **Bez mého svolení prosím ne:** stahovat a dál šířit obrázky obrazů, tisknout je, upravovat, používat
  je v jiných dílech, na výrobcích nebo v reklamě, ani je používat k učení umělé inteligence.

  Koupí originálu získáte obraz samotný, ne právo ho dál rozmnožovat (tisky, pohlednice, obrázky).

# Nadpis stránky, zároveň titulek v záložce prohlížeče, např. „Podmínky užití“. Povinné.
title: Podmínky užití

